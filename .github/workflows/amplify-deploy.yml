name: Trigger Amplify Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  trigger-amplify:
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade --user awscli
          export PATH="$HOME/.local/bin:$PATH"
          aws --version || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger Amplify Console build
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
        run: |
          if [ -z "$AMPLIFY_APP_ID" ] || [ -z "$AMPLIFY_BRANCH" ]; then
            echo "ERROR: Set AMPLIFY_APP_ID and AMPLIFY_BRANCH in repository secrets." && exit 1
          fi
          aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-type RELEASE

      - name: Done
        run: echo "Amplify start-job requested (check Amplify Console)."